name: Build & Release Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-rc3-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Mishkun/ataman-intellij' && github.ref == 'refs/heads/release/v2-rc3'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test RC release guards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Assert candidate source and unused RC tag
        run: python scripts/release_rc.py preflight
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build, test and verify RC3 on lower and latest supported IDE
        run: ./gradlew build verifyPlugin uiTestClasses -PpluginVerificationVersions=2024.3,2026.2.3 --no-daemon
      - name: Freeze and inspect tested ZIP
        run: python scripts/release_rc.py freeze
      - name: Preserve frozen ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: rc3-release-archive
          path: ${{ runner.temp }}/rc3-release/
          if-no-files-found: error
      - name: Create draft, check uploaded assets, publish GitHub prerelease only
        run: python scripts/release_rc.py publish
      - name: Upload verification and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc3-reports
          path: |
            build/reports/pluginVerifier/
            build/reports/tests/
            build/test-results/
      - name: Explain safe recovery
        if: failure()
        run: |
          echo 'RC3 failed. Existing tags/releases are never overwritten. If a draft or tag exists, inspect its source commit and assets before manual recovery; do not delete or retry blindly. No Marketplace upload or stable release is performed.' >> "$GITHUB_STEP_SUMMARY"
